spring:
  application:
    name: ${SPRING_APP_NAME:spring-sec-sec6}
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazybank}
    username: ${DATABASE_USERNAME:shrikant}
    password: ${DATABASE_PASSWORD:kale}
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      show-sql: ${JPA_SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: ${HIBERNATE_FORMAT_SQL:false}
logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%clr(%d{HH:mm:ss.SSS}){green} %clr(%5level){blue} %clr([%15.15t]){red} %clr(%-15.15logger{15}){yellow} : %msg%n}"

  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:ERROR}

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:10m}
